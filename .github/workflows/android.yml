# Builds the signed Android APK (TWA wrapping the GitHub Pages PWA) and
# attaches it to the public "android" release, so the phone can download it
# straight from the repo's Releases page. Trigger: any push to main that
# touches the app, or run it manually from the Actions tab.
name: Build Jackie APK
on:
  push:
    branches: [main]
    paths:
      - twa-manifest.json
      - .github/workflows/android.yml
      - web/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Restore signing keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android.keystore

      - name: Point Bubblewrap at the runner's JDK and Android SDK
        # Bubblewrap validates the SDK by looking for the LEGACY <sdk>/tools
        # folder (it's what its own installer creates). Modern SDKs ship
        # cmdline-tools/latest instead — a symlink bridges the two layouts.
        run: |
          ln -sfn "$ANDROID_HOME/cmdline-tools/latest" "$ANDROID_HOME/tools" \
            || sudo ln -sfn "$ANDROID_HOME/cmdline-tools/latest" "$ANDROID_HOME/tools"
          ls -la "$ANDROID_HOME/tools/bin/sdkmanager"
          mkdir -p ~/.bubblewrap
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}' "$JAVA_HOME" "$ANDROID_HOME" \
            > ~/.bubblewrap/config.json

      - name: Generate the Android project from twa-manifest.json
        run: npx --yes @bubblewrap/cli@1.21.0 update --skipVersionUpgrade

      - name: Build the signed APK
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: npx --yes @bubblewrap/cli@1.21.0 build --skipPwaValidation

      - name: Collect artifact
        run: cp app-release-signed.apk Jackie.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Jackie-apk
          path: Jackie.apk

      - name: Publish to the download release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android
          name: "Jackie — Android app"
          body: |
            📱 **Install on your phone**: download `Jackie.apk` below, open it,
            allow "install unknown apps" when Android asks, done.
            Open Jackie, tap the mic, and talk — "Hey Jackie" works while the app is open.
          files: Jackie.apk
          make_latest: true
